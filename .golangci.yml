version: "2"

linters:
  # "standard" (v2 default) already enables errcheck, govet, ineffassign, staticcheck, unused.
  enable:
    # Security
    - gosec        # Go security checker — catches hardcoded creds, weak crypto, path injection, etc.
    - bodyclose    # HTTP response body leak
    - noctx        # HTTP requests without context

    # Correctness
    - exhaustive   # missing switch cases on enums

    # Code quality
    - misspell
    - unconvert

  settings:
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104  # suppress "unhandled error" — covered by errcheck instead

    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment  # micro-optimization irrelevant for a CLI tool; hurts readability

  exclusions:
    # Matches v1's default exclusions so the migration doesn't change what gets reported.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Demo/fake data files don't need the same rigor
      - path: ".*demo.*"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
